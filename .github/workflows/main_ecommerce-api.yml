# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ecommerce-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # requerido para actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'   # Ajusta según tu <TargetFramework> en WebAPI.csproj

      - name: Build with dotnet
        run: dotnet build ./Ecommerce/WebAPI/WebAPI.csproj --configuration Release
        # ✅ Compila directamente el proyecto WebAPI.csproj

      - name: dotnet publish
        run: dotnet publish ./Ecommerce/WebAPI/WebAPI.csproj -c Release -o ./publish
        # ✅ Publica en carpeta ./publish dentro del workspace

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish
          # ✅ Sube el contenido publicado

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write # requerido para OIDC
      contents: read # requerido para actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_21B7AF2804BA4F3B9641328623D8EE5E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A75943787A0A4630A5D78D3955CE80ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2126342365E407E86BF4B0BE8B4540F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecommerce-api'
          slot-name: 'Production'
          package: .net-app
          # ✅ Ahora apunta al artifact descargado, no a ./publish



